<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Double Tunnel Giant Rooms</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #05070a;
      display: grid;
      place-items: center;
      font-family: monospace;
    }

    canvas {
      background: #04060a;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.8);
      max-width: 100vw;
      max-height: 100vh;
      width: auto;
      height: auto;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    #nameOverlay {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.72);
      z-index: 20;
    }

    #nameOverlay .panel {
      width: min(94vw, 620px);
      background: #08101a;
      border: 3px solid #38c9ff;
      padding: 28px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      color: #fff;
      font-family: monospace;
    }

    #nameTitle {
      font-size: 42px;
      color: #66ddff;
      line-height: 1.1;
    }

    #nameInfo {
      font-size: 26px;
      color: #ffd76a;
      line-height: 1.35;
    }

    #nameInput {
      font-size: 34px;
      padding: 14px;
      background: #04060a;
      color: #fff;
      border: 2px solid #38c9ff;
      outline: none;
      width: 100%;
      box-sizing: border-box;
    }

    #nameOverlay .buttons {
      display: flex;
      gap: 16px;
    }

    #nameOverlay button {
      flex: 1;
      font-size: 32px;
      padding: 18px;
      background: #123044;
      color: #fff;
      border: 2px solid #38c9ff;
    }

    #nameOverlay button:active {
      background: #245a79;
    }
  </style>
</head>
<body>
<canvas id="game" width="1280" height="800"></canvas>

<div id="nameOverlay">
  <div class="panel">
    <div id="nameTitle">НОВЫЙ РЕКОРД</div>
    <div id="nameInfo"></div>
    <input
      id="nameInput"
      maxlength="14"
      placeholder="Имя"
      autocomplete="off"
      autocapitalize="characters"
      spellcheck="false"
    />
    <div class="buttons">
      <button id="nameOk" type="button">Сохранить</button>
      <button id="nameCancel" type="button">Отмена</button>
    </div>
  </div>
</div>

<script>
'use strict';

const W = 1280;
const H = 800;

// Очень крупные комнаты туннелей.
const CELL_W = 675;
const CELL_H = 525;

// Толщина стены.
const WALL = 85;

// Ширина прохода между соседними ячейками.
const OPEN = 275;

// Скорость увеличена под крупный масштаб.
const DEFAULT_SPEED = 650;
const MIN_SPEED = 200;
const MAX_SPEED = 1800;
const SPEED_STEP = 50;

// Генерация под крупные комнаты.
const INITIAL_FORWARD = 3;
const INITIAL_BACK = 1;

const AHEAD_MIN = 2;
const EXTEND_BATCH = 2;

const KEEP_BEHIND = 1;
const MAX_ACTIVE = 60;

// Рекорды сбрасываем, так как базовая скорость и масштаб изменились.
const RECORDS_KEY = 'double_tunnel_continuous_records_v5_giant';
const LAST_NAME_KEY = 'double_tunnel_last_name_v5_giant';
const SPEEDS_KEY = 'double_tunnel_speeds_v5_giant';

const DIRS = {
  up:    { x: 0, y: -1 },
  down:  { x: 0, y:  1 },
  left:  { x: -1, y: 0 },
  right: { x: 1, y: 0 }
};

const DIR_ORDER = ['up', 'left', 'down', 'right'];

const DIR_ARROWS = {
  up: '▲',
  down: '▼',
  left: '◀',
  right: '▶'
};

const KEYMAP = {
  KeyW: [0, 'up'],
  KeyA: [0, 'left'],
  KeyS: [0, 'down'],
  KeyD: [0, 'right'],

  ArrowUp:    [1, 'up'],
  ArrowLeft:  [1, 'left'],
  ArrowDown:  [1, 'down'],
  ArrowRight: [1, 'right']
};

const PREVENT_KEYS = new Set([
  'ArrowUp',
  'ArrowDown',
  'ArrowLeft',
  'ArrowRight',
  'Space'
]);

// Крупные меню.
const MENU_ROW_W = 1120;
const MENU_ROW_H = 92;
const MENU_TOP = 230;
const MENU_STEP = 110;

const PAUSE_TOP = 260;
const PAUSE_STEP = 102;

const GAMEOVER_TOP = 380;
const GAMEOVER_STEP = 102;

// Огромные тачпады.
const DPAD_BASE_R = Math.min(W, H) * 0.34;
const DPAD_OFF = DPAD_BASE_R * 0.62;
const DPAD_BTN_R = DPAD_BASE_R * 0.34;
const DPAD_HIT_R = DPAD_BASE_R * 0.46;

function key(x, y) {
  return `${x},${y}`;
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function randomDirs() {
  return shuffle([
    { x: 0, y: -1 },
    { x: 0, y: 1 },
    { x: -1, y: 0 },
    { x: 1, y: 0 }
  ]);
}

function clampSpeed(v) {
  return Math.max(MIN_SPEED, Math.min(MAX_SPEED, Math.round(v)));
}

function rectHit(pos, r) {
  return pos.x >= r.x && pos.x <= r.x + r.w && pos.y >= r.y && pos.y <= r.y + r.h;
}

function menuRowRect(index) {
  return {
    x: W / 2 - MENU_ROW_W / 2,
    y: MENU_TOP + index * MENU_STEP - MENU_ROW_H / 2,
    w: MENU_ROW_W,
    h: MENU_ROW_H
  };
}

function speedSideRect(row, side) {
  const w = 120;
  const h = row.h;

  if (side === 'left') {
    return { x: row.x + 12, y: row.y, w, h };
  }

  return { x: row.x + row.w - w - 12, y: row.y, w, h };
}

function uiRowRect(index, top, step) {
  const w = 1040;
  const h = 92;

  return {
    x: W / 2 - w / 2,
    y: top + index * step - h / 2,
    w,
    h
  };
}

function recordsBackRect() {
  return {
    x: W / 2 - 320,
    y: 680,
    w: 640,
    h: 100
  };
}

function playPauseRect() {
  return {
    x: W - 160,
    y: 16,
    w: 140,
    h: 76
  };
}

function dpadCenter(tunnelIndex) {
  if (tunnelIndex === 0) {
    return {
      x: DPAD_BASE_R * 1.08,
      y: H - DPAD_BASE_R * 0.82
    };
  }

  return {
    x: W - DPAD_BASE_R * 1.08,
    y: H - DPAD_BASE_R * 0.82
  };
}

function dpadButtonCenter(tunnelIndex, dirName) {
  const c = dpadCenter(tunnelIndex);

  if (dirName === 'up') {
    return { x: c.x, y: c.y - DPAD_OFF };
  }

  if (dirName === 'down') {
    return { x: c.x, y: c.y + DPAD_OFF };
  }

  if (dirName === 'left') {
    return { x: c.x - DPAD_OFF, y: c.y };
  }

  return { x: c.x + DPAD_OFF, y: c.y };
}

// Формула рекордного рейтинга.
function calcRecordRating(score, speed1, speed2) {
  const s = Number(score) || 0;
  const v1 = clampSpeed(Number(speed1) || DEFAULT_SPEED);
  const v2 = clampSpeed(Number(speed2) || DEFAULT_SPEED);

  if (s <= 0) return 0;

  const vmax = Math.max(v1, v2);
  const vmin = Math.min(v1, v2);

  const effectiveSpeed = 0.75 * vmax + 0.25 * vmin;

  return Math.round(s * effectiveSpeed / DEFAULT_SPEED);
}

function normalizeRecord(r) {
  const score = Number(r && r.score) || 0;
  const speed1 = clampSpeed(Number(r && r.speed1) || DEFAULT_SPEED);
  const speed2 = clampSpeed(Number(r && r.speed2) || DEFAULT_SPEED);

  const oldRating = Number(r && r.rating);
  const rating = oldRating > 0
    ? oldRating
    : calcRecordRating(score, speed1, speed2);

  return {
    name: String((r && r.name) || 'PLAYER').slice(0, 14),
    score,
    p1: Number(r && r.p1) || 0,
    p2: Number(r && r.p2) || 0,
    speed1,
    speed2,
    rating,
    date: (r && r.date) || new Date().toISOString()
  };
}

function loadSpeeds() {
  try {
    const raw = localStorage.getItem(SPEEDS_KEY);
    const obj = JSON.parse(raw);

    if (!obj) {
      return { s1: DEFAULT_SPEED, s2: DEFAULT_SPEED };
    }

    return {
      s1: clampSpeed(obj.s1 === undefined ? DEFAULT_SPEED : obj.s1),
      s2: clampSpeed(obj.s2 === undefined ? DEFAULT_SPEED : obj.s2)
    };
  } catch (e) {
    return { s1: DEFAULT_SPEED, s2: DEFAULT_SPEED };
  }
}

function storeSpeeds(s1, s2) {
  try {
    localStorage.setItem(SPEEDS_KEY, JSON.stringify({ s1, s2 }));
  } catch (e) {
    // ignore
  }
}

function loadRecords() {
  try {
    const raw = localStorage.getItem(RECORDS_KEY);
    const arr = JSON.parse(raw);
    return Array.isArray(arr) ? arr : [];
  } catch (e) {
    return [];
  }
}

function storeRecords(records) {
  try {
    localStorage.setItem(RECORDS_KEY, JSON.stringify(records));
  } catch (e) {
    // ignore
  }
}

function loadLastName() {
  try {
    return localStorage.getItem(LAST_NAME_KEY) || 'PLAYER';
  } catch (e) {
    return 'PLAYER';
  }
}

function storeLastName(name) {
  try {
    localStorage.setItem(LAST_NAME_KEY, name);
  } catch (e) {
    // ignore
  }
}

function speedLabelFromRecord(r) {
  const s1 = r.speed1 === undefined ? DEFAULT_SPEED : r.speed1;
  const s2 = r.speed2 === undefined ? DEFAULT_SPEED : r.speed2;

  if (s1 === s2) {
    return `${s1}`;
  }

  return `${s1}/${s2}`;
}

class Tunnel {
  constructor(color, label) {
    this.color = color;
    this.label = label;
    this.reset();
  }

  reset() {
    this.progress = 0;
    this.alive = true;
    this.buildInitial({ gx: 0, gy: 0 }, false);
  }

  headAbs() {
    return this.tailIndex + this.path.length - 1;
  }

  addCell(gx, gy) {
    const idx = this.tailIndex + this.path.length;
    this.path.push({ gx, gy });
    this.cellMap.set(key(gx, gy), idx);
    return idx;
  }

  removeTail() {
    if (this.path.length <= 1) return;

    const c = this.path.shift();
    this.cellMap.delete(key(c.gx, c.gy));
    this.tailIndex++;
  }

  cellCenter(gx, gy) {
    return {
      x: gx * CELL_W + CELL_W / 2,
      y: gy * CELL_H + CELL_H / 2
    };
  }

  cellInterior(gx, gy) {
    return {
      x: gx * CELL_W + WALL,
      y: gy * CELL_H + WALL,
      w: CELL_W - WALL * 2,
      h: CELL_H - WALL * 2
    };
  }

  passageRect(a, b) {
    const dx = b.gx - a.gx;
    const dy = b.gy - a.gy;

    if (Math.abs(dx) === 1 && dy === 0) {
      const minX = Math.min(a.gx, b.gx);

      return {
        x: minX * CELL_W + CELL_W - WALL,
        y: a.gy * CELL_H + CELL_H / 2 - OPEN / 2,
        w: WALL * 2,
        h: OPEN
      };
    }

    if (dx === 0 && Math.abs(dy) === 1) {
      const minY = Math.min(a.gy, b.gy);

      return {
        x: a.gx * CELL_W + CELL_W / 2 - OPEN / 2,
        y: minY * CELL_H + CELL_H - WALL,
        w: OPEN,
        h: WALL * 2
      };
    }

    return null;
  }

  pointInRect(x, y, r) {
    return x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h;
  }

  queryPoint(x, y) {
    for (let i = 0; i < this.path.length; i++) {
      const c = this.path[i];
      const r = this.cellInterior(c.gx, c.gy);

      if (this.pointInRect(x, y, r)) {
        return {
          inside: true,
          cellAbs: this.tailIndex + i
        };
      }
    }

    for (let i = 0; i < this.path.length - 1; i++) {
      const r = this.passageRect(this.path[i], this.path[i + 1]);

      if (r && this.pointInRect(x, y, r)) {
        return {
          inside: true,
          cellAbs: null
        };
      }
    }

    return {
      inside: false,
      cellAbs: null
    };
  }

  canPlaceStatic(gx, gy, pgx, pgy, occupied) {
    const k = key(gx, gy);
    if (occupied.has(k)) return false;

    const prevKey = key(pgx, pgy);

    const neighbors = [
      { x: gx + 1, y: gy },
      { x: gx - 1, y: gy },
      { x: gx, y: gy + 1 },
      { x: gx, y: gy - 1 }
    ];

    for (const n of neighbors) {
      const nk = key(n.x, n.y);

      if (occupied.has(nk) && nk !== prevKey) {
        return false;
      }
    }

    return true;
  }

  genChain(sx, sy, steps, occupied, chain, center, boundX, boundY) {
    let cx = sx;
    let cy = sy;

    for (let i = 0; i < steps; i++) {
      let placed = false;

      for (const d of randomDirs()) {
        const nx = cx + d.x;
        const ny = cy + d.y;

        if (
          Math.abs(nx - center.gx) > boundX ||
          Math.abs(ny - center.gy) > boundY
        ) {
          continue;
        }

        if (this.canPlaceStatic(nx, ny, cx, cy, occupied)) {
          occupied.add(key(nx, ny));
          chain.push({ gx: nx, gy: ny });
          cx = nx;
          cy = ny;
          placed = true;
          break;
        }
      }

      if (!placed) return false;
    }

    return true;
  }

  tryBuildRandom(center) {
    const boundX = 3;
    const boundY = 2;

    const occupied = new Set([key(center.gx, center.gy)]);

    const forward = [{ gx: center.gx, gy: center.gy }];
    if (!this.genChain(
      center.gx,
      center.gy,
      INITIAL_FORWARD,
      occupied,
      forward,
      center,
      boundX,
      boundY
    )) {
      return false;
    }

    const backward = [{ gx: center.gx, gy: center.gy }];
    if (!this.genChain(
      center.gx,
      center.gy,
      INITIAL_BACK,
      occupied,
      backward,
      center,
      boundX,
      boundY
    )) {
      return false;
    }

    const cells = [
      ...backward.slice(1).reverse(),
      ...forward
    ];

    this.path = [];
    this.cellMap = new Map();
    this.tailIndex = 0;

    for (const c of cells) {
      this.addCell(c.gx, c.gy);
    }

    this.currentAbs = INITIAL_BACK;
    this.pos = this.cellCenter(center.gx, center.gy);
    this.updateDirFromPath();

    return true;
  }

  buildFallback(center, savedProgress) {
    this.path = [];
    this.cellMap = new Map();
    this.tailIndex = 0;

    const back = 1;
    const forward = 3;

    for (let i = -back; i <= forward; i++) {
      this.addCell(center.gx + i, center.gy);
    }

    this.currentAbs = back;
    this.pos = this.cellCenter(center.gx, center.gy);
    this.updateDirFromPath();

    this.progress = savedProgress;
    this.alive = true;
  }

  buildInitial(center, keepProgress) {
    const saved = keepProgress ? this.progress : 0;

    this.path = [];
    this.cellMap = new Map();
    this.tailIndex = 0;
    this.currentAbs = 0;
    this.pos = this.cellCenter(center.gx, center.gy);
    this.dir = { x: 1, y: 0 };
    this.alive = true;

    for (let attempt = 0; attempt < 150; attempt++) {
      if (this.tryBuildRandom(center)) {
        this.progress = saved;
        return;
      }
    }

    this.buildFallback(center, saved);
  }

  getCurrentCell() {
    const i = this.currentAbs - this.tailIndex;

    if (i >= 0 && i < this.path.length) {
      return this.path[i];
    }

    return null;
  }

  updateDirFromPath() {
    const i = this.currentAbs - this.tailIndex;
    const cur = this.path[i];
    const next = this.path[i + 1];

    if (cur && next) {
      const dx = next.gx - cur.gx;
      const dy = next.gy - cur.gy;
      const len = Math.hypot(dx, dy) || 1;

      this.dir = {
        x: dx / len,
        y: dy / len
      };
    } else {
      this.dir = { x: 1, y: 0 };
    }
  }

  canPlaceMacro(gx, gy, pgx, pgy) {
    const k = key(gx, gy);
    if (this.cellMap.has(k)) return false;

    const prevKey = key(pgx, pgy);

    const neighbors = [
      { x: gx + 1, y: gy },
      { x: gx - 1, y: gy },
      { x: gx, y: gy + 1 },
      { x: gx, y: gy - 1 }
    ];

    for (const n of neighbors) {
      const nk = key(n.x, n.y);

      if (this.cellMap.has(nk) && nk !== prevKey) {
        return false;
      }
    }

    return true;
  }

  dfs(depth, gx, gy) {
    if (depth <= 0) return true;

    for (const d of randomDirs()) {
      const nx = gx + d.x;
      const ny = gy + d.y;

      if (this.canPlaceMacro(nx, ny, gx, gy)) {
        this.addCell(nx, ny);

        if (this.dfs(depth - 1, nx, ny)) {
          return true;
        }

        this.path.pop();
        this.cellMap.delete(key(nx, ny));
      }
    }

    return false;
  }

  extendDfs(depth) {
    if (depth <= 0) return true;
    if (!this.path.length) return false;

    const head = this.path[this.path.length - 1];
    return this.dfs(depth, head.gx, head.gy);
  }

  extendAhead() {
    if (!this.path.length) return;

    const ahead = this.headAbs() - this.currentAbs;
    if (ahead >= AHEAD_MIN) return;

    this.cleanup();

    const need = Math.min(EXTEND_BATCH, AHEAD_MIN - ahead + 2);

    if (this.extendDfs(need)) return;

    for (let n = Math.min(need, 2); n >= 1; n--) {
      if (this.extendDfs(n)) return;
    }

    let tries = 0;

    while (
      this.path.length > 4 &&
      this.tailIndex < this.currentAbs - 1 &&
      tries < 40
    ) {
      this.removeTail();
      tries++;

      if (this.extendDfs(1)) return;
    }

    const cur = this.getCurrentCell() || {
      gx: Math.floor(this.pos.x / CELL_W),
      gy: Math.floor(this.pos.y / CELL_H)
    };

    this.buildInitial({ gx: cur.gx, gy: cur.gy }, true);
  }

  cleanup() {
    const margin = 300;

    while (this.path.length > 1) {
      const abs = this.tailIndex;

      if (abs >= this.currentAbs - KEEP_BEHIND) break;

      const c = this.path[0];

      const rx = c.gx * CELL_W;
      const ry = c.gy * CELL_H;

      const sx = rx - this.pos.x + W / 2;
      const sy = ry - this.pos.y + H / 2;

      const offScreen =
        sx + CELL_W < -margin ||
        sx > W + margin ||
        sy + CELL_H < -margin ||
        sy > H + margin;

      if (offScreen || this.path.length > MAX_ACTIVE) {
        this.removeTail();
      } else {
        break;
      }
    }
  }

  enterCell(abs) {
    if (abs === this.currentAbs) return;

    if (abs === this.currentAbs + 1) {
      this.progress++;
      this.currentAbs = abs;
    } else if (abs === this.currentAbs - 1) {
      this.progress--;
      this.currentAbs = abs;
    } else {
      this.alive = false;
      return;
    }

    this.cleanup();
    this.extendAhead();
  }

  update(dt, speed) {
    if (!this.alive || !this.dir) return;

    let remaining = (speed || DEFAULT_SPEED) * dt;

    const maxStep = 10;

    while (remaining > 0.0001 && this.alive) {
      const step = Math.min(maxStep, remaining);
      remaining -= step;

      const nx = this.pos.x + this.dir.x * step;
      const ny = this.pos.y + this.dir.y * step;

      const q = this.queryPoint(nx, ny);

      if (!q.inside) {
        this.alive = false;
        break;
      }

      this.pos.x = nx;
      this.pos.y = ny;

      if (q.cellAbs !== null && q.cellAbs !== this.currentAbs) {
        this.enterCell(q.cellAbs);
      }
    }
  }
}

class StateMachine {
  constructor(owner) {
    this.owner = owner;
    this.states = {};
    this.current = null;
    this.currentName = '';
  }

  add(name, state) {
    this.states[name] = state;
  }

  set(name) {
    const next = this.states[name];
    if (!next) return;

    if (this.current && this.current.exit) {
      this.current.exit(this.owner);
    }

    this.current = next;
    this.currentName = name;

    if (this.current.enter) {
      this.current.enter(this.owner);
    }
  }

  update(dt) {
    if (this.current && this.current.update) {
      this.current.update(this.owner, dt);
    }
  }

  render(ctx) {
    if (this.current && this.current.render) {
      this.current.render(this.owner, ctx);
    }
  }

  handleKey(e, down) {
    if (this.current && this.current.handleKey) {
      this.current.handleKey(this.owner, e, down);
    }
  }
}

class Game {
  constructor(canvas) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d');

    this.time = 0;
    this.last = performance.now();

    this.tunnels = [];
    this.score = 0;
    this.finalScore = 0;

    this.held = [[], []];
    this.pointerControls = new Map();

    const speeds = loadSpeeds();
    this.speed1 = speeds.s1;
    this.speed2 = speeds.s2;
    this.runSpeeds = [this.speed1, this.speed2];

    this.records = loadRecords()
      .map(normalizeRecord)
      .sort((a, b) => b.rating - a.rating)
      .slice(0, 10);

    this.menuItems = ['start', 'speedAll', 'speed1', 'speed2', 'records'];
    this.menuIndex = 0;

    this.pauseItems = ['resume', 'restart', 'saveexit', 'exit'];
    this.pauseIndex = 0;

    this.gameoverItems = ['restart', 'save', 'menu'];
    this.gameoverIndex = 0;

    this.pendingRecord = null;
    this.pendingQualifies = false;

    this.nameOverlay = document.getElementById('nameOverlay');
    this.nameInfo = document.getElementById('nameInfo');
    this.nameInput = document.getElementById('nameInput');
    this.nameOk = document.getElementById('nameOk');
    this.nameCancel = document.getElementById('nameCancel');

    this.setupNameOverlayEvents();

    this.fsm = new StateMachine(this);
    this.setupStates();
    this.fsm.set('menu');

    window.addEventListener('keydown', (e) => {
      if (PREVENT_KEYS.has(e.code)) {
        e.preventDefault();
      }

      this.fsm.handleKey(e, true);
    });

    window.addEventListener('keyup', (e) => {
      this.fsm.handleKey(e, false);
    });

    this.canvas.addEventListener('pointerdown', (e) => this.onPointerDown(e), { passive: false });
    this.canvas.addEventListener('pointermove', (e) => this.onPointerMove(e), { passive: false });
    this.canvas.addEventListener('pointerup', (e) => this.onPointerUp(e), { passive: false });
    this.canvas.addEventListener('pointercancel', (e) => this.onPointerUp(e), { passive: false });
    this.canvas.addEventListener('contextmenu', (e) => e.preventDefault());

    this.loop = this.loop.bind(this);
    requestAnimationFrame(this.loop);
  }

  setupNameOverlayEvents() {
    this.nameOk.addEventListener('click', () => {
      if (this.fsm.currentName !== 'name') return;
      this.savePendingRecordWithName(this.nameInput.value);
    });

    this.nameCancel.addEventListener('click', () => {
      if (this.fsm.currentName !== 'name') return;

      this.pendingRecord = null;
      this.pendingQualifies = false;
      this.fsm.set('menu');
    });

    this.nameInput.addEventListener('keydown', (e) => {
      e.stopPropagation();

      if (e.key === 'Enter') {
        e.preventDefault();
        this.savePendingRecordWithName(this.nameInput.value);
      } else if (e.key === 'Escape') {
        e.preventDefault();

        this.pendingRecord = null;
        this.pendingQualifies = false;
        this.fsm.set('menu');
      }
    });
  }

  setupStates() {
    this.fsm.add('menu', {
      enter: (g) => {
        g.resetInput();
        g.menuIndex = 0;
      },

      render: (g, ctx) => {
        g.renderMenu(ctx);
      },

      handleKey: (g, e, down) => {
        g.handleMenuKey(e, down);
      }
    });

    this.fsm.add('play', {
      enter: (g) => {
        g.resetInput();
      },

      update: (g, dt) => {
        g.updatePlay(dt);
      },

      render: (g, ctx) => {
        g.renderPlay(ctx);
      },

      handleKey: (g, e, down) => {
        g.handlePlayKey(e, down);
      }
    });

    this.fsm.add('pause', {
      enter: (g) => {
        g.resetInput();
        g.pauseIndex = 0;
      },

      render: (g, ctx) => {
        g.renderPlay(ctx);
        g.renderPause(ctx);
      },

      handleKey: (g, e, down) => {
        g.handlePauseKey(e, down);
      }
    });

    this.fsm.add('gameover', {
      enter: (g) => {
        g.resetInput();
        g.gameoverIndex = 0;
      },

      render: (g, ctx) => {
        g.renderGameOver(ctx);
      },

      handleKey: (g, e, down) => {
        g.handleGameoverKey(e, down);
      }
    });

    this.fsm.add('records', {
      enter: (g) => {
        g.resetInput();
      },

      render: (g, ctx) => {
        g.renderRecords(ctx);
      },

      handleKey: (g, e, down) => {
        g.handleRecordsKey(e, down);
      }
    });

    this.fsm.add('name', {
      enter: (g) => {
        g.resetInput();

        if (!g.pendingRecord || !g.pendingQualifies) {
          g.fsm.set('menu');
          return;
        }

        g.showNameOverlay();
      },

      render: (g, ctx) => {
        g.renderNameOverlayBackground(ctx);
      },

      handleKey: () => {
        // Ввод имени обрабатывается DOM-оверлеем.
      },

      exit: (g) => {
        g.hideNameOverlay();
      }
    });
  }

  startGame() {
    this.runSpeeds = [this.speed1, this.speed2];

    this.tunnels = [
      new Tunnel('#38c9ff', 'WASD'),
      new Tunnel('#ff5ad1', 'ARROWS')
    ];

    this.score = 0;
    this.finalScore = 0;
    this.pendingRecord = null;
    this.pendingQualifies = false;

    this.resetInput();
    this.fsm.set('play');
  }

  resetInput() {
    this.held = [[], []];
    this.pointerControls.clear();
  }

  press(tunnelIndex, dir) {
    if (!this.held[tunnelIndex].includes(dir)) {
      this.held[tunnelIndex].push(dir);
    }
  }

  release(tunnelIndex, dir) {
    this.held[tunnelIndex] = this.held[tunnelIndex].filter(d => d !== dir);
  }

  activeDirs(tunnelIndex) {
    const dirs = new Set(this.held[tunnelIndex]);

    for (const control of this.pointerControls.values()) {
      if (control.tunnel === tunnelIndex) {
        dirs.add(control.dir);
      }
    }

    return dirs;
  }

  inputVector(tunnelIndex) {
    let x = 0;
    let y = 0;

    for (const dirName of this.activeDirs(tunnelIndex)) {
      const d = DIRS[dirName];
      x += d.x;
      y += d.y;
    }

    if (x === 0 && y === 0) {
      return null;
    }

    const len = Math.hypot(x, y) || 1;

    return {
      x: x / len,
      y: y / len
    };
  }

  isDirActive(tunnelIndex, dirName) {
    if (this.held[tunnelIndex].includes(dirName)) {
      return true;
    }

    for (const control of this.pointerControls.values()) {
      if (control.tunnel === tunnelIndex && control.dir === dirName) {
        return true;
      }
    }

    return false;
  }

  calcScore() {
    if (!this.tunnels.length) return 0;

    const a = Math.max(0, this.tunnels[0].progress);
    const b = Math.max(0, this.tunnels[1].progress);

    const min = Math.min(a, b);
    const max = Math.max(a, b);

    return Math.round(10 * (1.75 * min + 0.25 * max));
  }

  makePendingRecord(score, p1, p2) {
    if (!score || score <= 0) return null;

    const speed1 = this.runSpeeds ? this.runSpeeds[0] : this.speed1;
    const speed2 = this.runSpeeds ? this.runSpeeds[1] : this.speed2;

    const rating = calcRecordRating(score, speed1, speed2);

    if (!rating || rating <= 0) return null;

    return {
      score: Math.round(score),
      p1,
      p2,
      speed1,
      speed2,
      rating,
      date: new Date().toISOString()
    };
  }

  wouldEntryQualify(entry) {
    if (!entry || !entry.rating || entry.rating <= 0) {
      return false;
    }

    const blockedBySameSpeed = this.records.some((r) => {
      return (
        r.speed1 === entry.speed1 &&
        r.speed2 === entry.speed2 &&
        r.rating >= entry.rating
      );
    });

    if (blockedBySameSpeed) {
      return false;
    }

    if (this.records.length < 10) {
      return true;
    }

    const worst = this.records[this.records.length - 1];
    return entry.rating > worst.rating;
  }

  getCurrentPendingPreview() {
    if (!this.tunnels.length) return null;

    const p1 = this.tunnels[0].progress;
    const p2 = this.tunnels[1].progress;

    return this.makePendingRecord(this.calcScore(), p1, p2);
  }

  currentResultQualifies() {
    return this.wouldEntryQualify(this.getCurrentPendingPreview());
  }

  preparePendingFromCurrent() {
    this.pendingRecord = this.getCurrentPendingPreview();
    this.pendingQualifies = this.wouldEntryQualify(this.pendingRecord);
  }

  enterGameOver() {
    this.finalScore = this.calcScore();

    const p1 = this.tunnels.length ? this.tunnels[0].progress : 0;
    const p2 = this.tunnels.length ? this.tunnels[1].progress : 0;

    this.pendingRecord = this.makePendingRecord(this.finalScore, p1, p2);
    this.pendingQualifies = this.wouldEntryQualify(this.pendingRecord);

    this.fsm.set('gameover');
  }

  showNameOverlay() {
    if (!this.pendingRecord) return;

    this.nameInfo.innerHTML =
      `Score: ${this.pendingRecord.score}<br>` +
      `Record rating: ${this.pendingRecord.rating}<br>` +
      `Speed: ${this.pendingRecord.speed1}/${this.pendingRecord.speed2}`;

    this.nameInput.value = loadLastName();
    this.nameOverlay.style.display = 'flex';

    setTimeout(() => {
      this.nameInput.focus();
    }, 0);
  }

  hideNameOverlay() {
    this.nameOverlay.style.display = 'none';
    this.nameInput.blur();
  }

  savePendingRecordWithName(rawName) {
    if (!this.pendingRecord || !this.pendingQualifies) {
      this.fsm.set('menu');
      return;
    }

    const name = String(rawName || '').trim().slice(0, 14) || 'PLAYER';
    storeLastName(name);

    const entry = normalizeRecord(
      Object.assign({}, this.pendingRecord, { name })
    );

    this.records.push(entry);
    this.records.sort((a, b) => b.rating - a.rating);
    this.records = this.records.slice(0, 10);

    storeRecords(this.records);

    this.pendingRecord = null;
    this.pendingQualifies = false;

    this.fsm.set('records');
  }

  adjustSpeed(itemId, delta) {
    if (itemId === 'speedAll') {
      const base = this.speed1 === this.speed2
        ? this.speed1
        : Math.round((this.speed1 + this.speed2) / 2);

      const v = clampSpeed(base + delta);
      this.speed1 = v;
      this.speed2 = v;
    } else if (itemId === 'speed1') {
      this.speed1 = clampSpeed(this.speed1 + delta);
    } else if (itemId === 'speed2') {
      this.speed2 = clampSpeed(this.speed2 + delta);
    } else {
      return;
    }

    storeSpeeds(this.speed1, this.speed2);
  }

  updatePlay(dt) {
    const sec = Math.min(dt, 50) / 1000;

    for (let i = 0; i < 2; i++) {
      const v = this.inputVector(i);

      if (v) {
        this.tunnels[i].dir = v;
      }

      this.tunnels[i].update(sec, this.runSpeeds[i]);

      if (!this.tunnels[i].alive) {
        this.enterGameOver();
        return;
      }
    }

    if (!this.tunnels[0].alive || !this.tunnels[1].alive) {
      this.enterGameOver();
      return;
    }

    this.score = this.calcScore();
  }

  handlePlayKey(e, down) {
    if (down && !e.repeat && e.code === 'Escape') {
      this.fsm.set('pause');
      return;
    }

    const mapped = KEYMAP[e.code];
    if (!mapped) return;

    const [tunnelIndex, dir] = mapped;

    if (down) {
      if (!e.repeat) {
        this.press(tunnelIndex, dir);
      }
    } else {
      this.release(tunnelIndex, dir);
    }
  }

  handleMenuKey(e, down) {
    if (!down) return;

    if (e.code === 'ArrowUp') {
      this.menuIndex = (this.menuIndex - 1 + this.menuItems.length) % this.menuItems.length;
      return;
    }

    if (e.code === 'ArrowDown') {
      this.menuIndex = (this.menuIndex + 1) % this.menuItems.length;
      return;
    }

    const selected = this.menuItems[this.menuIndex];

    if (e.code === 'ArrowLeft') {
      this.adjustSpeed(selected, -SPEED_STEP);
      return;
    }

    if (e.code === 'ArrowRight') {
      this.adjustSpeed(selected, SPEED_STEP);
      return;
    }

    if ((e.code === 'Enter' || e.code === 'Space') && !e.repeat) {
      if (selected === 'start') {
        this.startGame();
      } else if (selected === 'records') {
        this.fsm.set('records');
      }
    }
  }

  handlePauseKey(e, down) {
    if (!down) return;

    if (e.code === 'Escape' && !e.repeat) {
      this.fsm.set('play');
      return;
    }

    if (e.code === 'ArrowUp') {
      this.pauseIndex = (this.pauseIndex - 1 + this.pauseItems.length) % this.pauseItems.length;
      return;
    }

    if (e.code === 'ArrowDown') {
      this.pauseIndex = (this.pauseIndex + 1) % this.pauseItems.length;
      return;
    }

    if (e.code === 'Enter' && !e.repeat) {
      this.executePauseItem(this.pauseItems[this.pauseIndex]);
    }
  }

  executePauseItem(id) {
    if (id === 'resume') {
      this.fsm.set('play');
    } else if (id === 'restart') {
      this.startGame();
    } else if (id === 'saveexit') {
      this.preparePendingFromCurrent();

      if (this.pendingRecord && this.pendingQualifies) {
        this.fsm.set('name');
      }
    } else if (id === 'exit') {
      this.fsm.set('menu');
    }
  }

  handleGameoverKey(e, down) {
    if (!down) return;

    if (e.code === 'ArrowUp') {
      this.gameoverIndex = (this.gameoverIndex - 1 + this.gameoverItems.length) % this.gameoverItems.length;
      return;
    }

    if (e.code === 'ArrowDown') {
      this.gameoverIndex = (this.gameoverIndex + 1) % this.gameoverItems.length;
      return;
    }

    if (e.code === 'Enter' && !e.repeat) {
      this.executeGameoverItem(this.gameoverItems[this.gameoverIndex]);
    }
  }

  executeGameoverItem(id) {
    if (id === 'restart') {
      this.startGame();
    } else if (id === 'save') {
      if (this.pendingRecord && this.pendingQualifies) {
        this.fsm.set('name');
      }
    } else if (id === 'menu') {
      this.fsm.set('menu');
    }
  }

  handleRecordsKey(e, down) {
    if (!down || e.repeat) return;

    if (e.code === 'Enter' || e.code === 'Escape' || e.code === 'Space') {
      this.fsm.set('menu');
    }
  }

  canvasPos(e) {
    const rect = this.canvas.getBoundingClientRect();

    return {
      x: (e.clientX - rect.left) * (W / rect.width),
      y: (e.clientY - rect.top) * (H / rect.height)
    };
  }

  onPointerDown(e) {
    if (this.fsm.currentName === 'name') {
      return;
    }

    if (e.cancelable) {
      e.preventDefault();
    }

    const pos = this.canvasPos(e);

    if (this.fsm.currentName === 'menu') {
      this.handleMenuPointerDown(pos);
    } else if (this.fsm.currentName === 'records') {
      this.handleRecordsPointerDown(pos);
    } else if (this.fsm.currentName === 'pause') {
      this.handlePausePointerDown(pos);
    } else if (this.fsm.currentName === 'gameover') {
      this.handleGameoverPointerDown(pos);
    } else if (this.fsm.currentName === 'play') {
      this.handlePlayPointerDown(e, pos);
    }
  }

  onPointerMove(e) {
    if (this.fsm.currentName !== 'play') return;

    if (!this.pointerControls.has(e.pointerId)) return;

    if (e.cancelable) {
      e.preventDefault();
    }

    this.updatePointerControl(e.pointerId, this.canvasPos(e));
  }

  onPointerUp(e) {
    this.pointerControls.delete(e.pointerId);
  }

  handleMenuPointerDown(pos) {
    for (let i = 0; i < this.menuItems.length; i++) {
      const id = this.menuItems[i];
      const row = menuRowRect(i);

      if (id === 'speedAll' || id === 'speed1' || id === 'speed2') {
        const minus = speedSideRect(row, 'left');
        const plus = speedSideRect(row, 'right');

        if (rectHit(pos, minus)) {
          this.menuIndex = i;
          this.adjustSpeed(id, -SPEED_STEP);
          return;
        }

        if (rectHit(pos, plus)) {
          this.menuIndex = i;
          this.adjustSpeed(id, SPEED_STEP);
          return;
        }
      }

      if (rectHit(pos, row)) {
        this.menuIndex = i;

        if (id === 'start') {
          this.startGame();
        } else if (id === 'records') {
          this.fsm.set('records');
        }

        return;
      }
    }
  }

  handleRecordsPointerDown(pos) {
    if (rectHit(pos, recordsBackRect())) {
      this.fsm.set('menu');
    }
  }

  handlePausePointerDown(pos) {
    for (let i = 0; i < this.pauseItems.length; i++) {
      const row = uiRowRect(i, PAUSE_TOP, PAUSE_STEP);

      if (rectHit(pos, row)) {
        this.pauseIndex = i;
        this.executePauseItem(this.pauseItems[i]);
        return;
      }
    }
  }

  handleGameoverPointerDown(pos) {
    for (let i = 0; i < this.gameoverItems.length; i++) {
      const row = uiRowRect(i, GAMEOVER_TOP, GAMEOVER_STEP);

      if (rectHit(pos, row)) {
        this.gameoverIndex = i;
        this.executeGameoverItem(this.gameoverItems[i]);
        return;
      }
    }
  }

  handlePlayPointerDown(e, pos) {
    if (rectHit(pos, playPauseRect())) {
      this.fsm.set('pause');
      return;
    }

    const hit = this.dpadButtonAt(pos);

    if (hit) {
      try {
        this.canvas.setPointerCapture(e.pointerId);
      } catch (err) {
        // ignore
      }

      this.updatePointerControl(e.pointerId, pos);
    }
  }

  dpadButtonAt(pos) {
    for (let tunnel = 0; tunnel < 2; tunnel++) {
      for (const dirName of DIR_ORDER) {
        const c = dpadButtonCenter(tunnel, dirName);
        const d = Math.hypot(pos.x - c.x, pos.y - c.y);

        if (d <= DPAD_HIT_R) {
          return { tunnel, dir: dirName };
        }
      }
    }

    return null;
  }

  updatePointerControl(pointerId, pos) {
    const hit = this.dpadButtonAt(pos);

    if (hit) {
      this.pointerControls.set(pointerId, hit);
    } else {
      this.pointerControls.delete(pointerId);
    }
  }

  drawText(ctx, text, x, y, size = 16, color = '#fff', align = 'center') {
    ctx.save();
    ctx.fillStyle = color;
    ctx.font = `${size}px monospace`;
    ctx.textAlign = align;
    ctx.textBaseline = 'middle';
    ctx.fillText(text, x, y);
    ctx.restore();
  }

  drawUIButton(ctx, r, label, selected = false, enabled = true, fontSize = 34) {
    ctx.save();

    if (!enabled) {
      ctx.fillStyle = 'rgba(255,255,255,0.03)';
    } else if (selected) {
      ctx.fillStyle = 'rgba(255,255,255,0.14)';
    } else {
      ctx.fillStyle = 'rgba(255,255,255,0.06)';
    }

    ctx.fillRect(r.x, r.y, r.w, r.h);

    ctx.strokeStyle = selected ? '#66ddff' : '#284257';
    ctx.lineWidth = 3;
    ctx.strokeRect(r.x, r.y, r.w, r.h);

    ctx.restore();

    let color = enabled ? '#8fa3b8' : '#445566';
    if (selected && enabled) color = '#ffffff';

    this.drawText(ctx, label, r.x + r.w / 2, r.y + r.h / 2, fontSize, color);
  }

  drawSmallIconButton(ctx, r, label) {
    ctx.save();

    ctx.fillStyle = 'rgba(102,221,255,0.18)';
    ctx.fillRect(r.x, r.y, r.w, r.h);

    ctx.strokeStyle = '#38c9ff';
    ctx.lineWidth = 3;
    ctx.strokeRect(r.x, r.y, r.w, r.h);

    ctx.restore();

    this.drawText(ctx, label, r.x + r.w / 2, r.y + r.h / 2, 52, '#ffffff');
  }

  renderMenu(ctx) {
    ctx.fillStyle = '#04060a';
    ctx.fillRect(0, 0, W, H);

    this.drawText(ctx, 'DOUBLE TUNNEL', W / 2, 82, 68, '#66ddff');
    this.drawText(ctx, 'GIANT ROOMS EDITION', W / 2, 140, 24, '#7f93a8');

    const speedAllLabel = this.speed1 === this.speed2
      ? `${this.speed1}`
      : `${this.speed1}/${this.speed2}`;

    const labels = {
      start: 'Старт',
      speedAll: `Скорость обоих: ${speedAllLabel}`,
      speed1: `Скорость T1: ${this.speed1}`,
      speed2: `Скорость T2: ${this.speed2}`,
      records: `Рекорды (${this.records.length}/10)`
    };

    this.menuItems.forEach((id, i) => {
      const row = menuRowRect(i);
      const selected = i === this.menuIndex;

      this.drawUIButton(
        ctx,
        row,
        labels[id],
        selected,
        true,
        selected ? 42 : 36
      );

      if (id === 'speedAll' || id === 'speed1' || id === 'speed2') {
        this.drawSmallIconButton(ctx, speedSideRect(row, 'left'), '-');
        this.drawSmallIconButton(ctx, speedSideRect(row, 'right'), '+');
      }
    });

    this.drawText(
      ctx,
      'Тапай по пунктам. Для скорости жми - / +',
      W / 2,
      748,
      22,
      '#5d7184'
    );

    this.drawText(
      ctx,
      `Формула рекорда: Rating = Score × (0.75×Vmax + 0.25×Vmin) / ${DEFAULT_SPEED}`,
      W / 2,
      778,
      18,
      '#ffd76a'
    );
  }

  renderTunnel(ctx, t) {
    ctx.save();
    ctx.globalAlpha = 0.42;
    ctx.fillStyle = t.color;

    for (const c of t.path) {
      const r = t.cellInterior(c.gx, c.gy);

      const sx = W / 2 + (r.x - t.pos.x);
      const sy = H / 2 + (r.y - t.pos.y);

      if (sx + r.w < -100 || sx > W + 100 || sy + r.h < -100 || sy > H + 100) {
        continue;
      }

      ctx.fillRect(sx, sy, r.w, r.h);
    }

    for (let i = 0; i < t.path.length - 1; i++) {
      const r = t.passageRect(t.path[i], t.path[i + 1]);
      if (!r) continue;

      const sx = W / 2 + (r.x - t.pos.x);
      const sy = H / 2 + (r.y - t.pos.y);

      if (sx + r.w < -100 || sx > W + 100 || sy + r.h < -100 || sy > H + 100) {
        continue;
      }

      ctx.fillRect(sx, sy, r.w, r.h);
    }

    ctx.restore();

    const cur = t.getCurrentCell();

    if (cur) {
      const r = t.cellInterior(cur.gx, cur.gy);

      const sx = W / 2 + (r.x - t.pos.x);
      const sy = H / 2 + (r.y - t.pos.y);

      ctx.save();
      ctx.globalAlpha = 0.95;
      ctx.strokeStyle = t.color;
      ctx.lineWidth = 5;
      ctx.strokeRect(sx, sy, r.w, r.h);
      ctx.restore();
    }
  }

  renderPlayer(ctx) {
    ctx.save();

    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 5;

    ctx.beginPath();
    ctx.moveTo(W / 2 - 20, H / 2);
    ctx.lineTo(W / 2 + 20, H / 2);
    ctx.moveTo(W / 2, H / 2 - 20);
    ctx.lineTo(W / 2, H / 2 + 20);
    ctx.stroke();

    ctx.restore();
  }

  renderDirectionArrows(ctx) {
    for (const t of this.tunnels) {
      if (!t.dir) continue;

      ctx.save();
      ctx.globalAlpha = 0.95;
      ctx.strokeStyle = t.color;
      ctx.lineWidth = 5;

      ctx.beginPath();
      ctx.moveTo(W / 2, H / 2);
      ctx.lineTo(W / 2 + t.dir.x * 56, H / 2 + t.dir.y * 56);
      ctx.stroke();

      ctx.restore();
    }
  }

  renderPauseButton(ctx) {
    const r = playPauseRect();

    ctx.save();

    ctx.fillStyle = 'rgba(255,255,255,0.10)';
    ctx.fillRect(r.x, r.y, r.w, r.h);

    ctx.strokeStyle = '#66ddff';
    ctx.lineWidth = 3;
    ctx.strokeRect(r.x, r.y, r.w, r.h);

    ctx.restore();

    this.drawText(ctx, 'II', r.x + r.w / 2, r.y + r.h / 2, 42, '#ffffff');
  }

  renderHud(ctx) {
    this.drawText(ctx, `SCORE: ${this.score}`, 18, 34, 40, '#ffffff', 'left');

    this.drawText(
      ctx,
      `T1 cells: ${this.tunnels[0].progress}`,
      18,
      86,
      26,
      this.tunnels[0].color,
      'left'
    );

    this.drawText(
      ctx,
      `T2 cells: ${this.tunnels[1].progress}`,
      18,
      122,
      26,
      this.tunnels[1].color,
      'left'
    );

    this.drawText(
      ctx,
      `Speed: ${this.runSpeeds[0]}/${this.runSpeeds[1]}`,
      W - 24,
      122,
      22,
      '#5d7184',
      'right'
    );
  }

  renderDpads(ctx) {
    if (!this.tunnels.length) return;

    for (let i = 0; i < 2; i++) {
      const c = dpadCenter(i);
      const color = this.tunnels[i].color;

      ctx.save();
      ctx.globalAlpha = 0.15;
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.arc(c.x, c.y, DPAD_BASE_R, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      this.drawText(
        ctx,
        i === 0 ? 'T1' : 'T2',
        c.x,
        c.y,
        Math.floor(DPAD_BASE_R * 0.18),
        color
      );

      for (const dirName of DIR_ORDER) {
        const b = dpadButtonCenter(i, dirName);
        const active = this.isDirActive(i, dirName);

        ctx.save();
        ctx.globalAlpha = active ? 0.92 : 0.30;
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.arc(b.x, b.y, DPAD_BTN_R, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        ctx.save();
        ctx.fillStyle = '#04060a';
        ctx.font = `${Math.floor(DPAD_BTN_R * 0.85)}px monospace`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(DIR_ARROWS[dirName], b.x, b.y + 2);
        ctx.restore();
      }
    }
  }

  renderPlay(ctx) {
    ctx.fillStyle = '#04060a';
    ctx.fillRect(0, 0, W, H);

    for (const t of this.tunnels) {
      this.renderTunnel(ctx, t);
    }

    this.renderPlayer(ctx);
    this.renderDirectionArrows(ctx);
    this.renderHud(ctx);

    if (this.fsm.currentName === 'play') {
      this.renderPauseButton(ctx);
      this.renderDpads(ctx);
    }
  }

  renderPause(ctx) {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.58)';
    ctx.fillRect(0, 0, W, H);

    this.drawText(ctx, 'PAUSE', W / 2, 110, 72, '#ffffff');
    this.drawText(ctx, `Текущий счёт: ${this.calcScore()}`, W / 2, 180, 34, '#aabbcc');

    const canSaveCurrent = this.currentResultQualifies();

    const labels = {
      resume: 'Продолжить',
      restart: 'Начать заново',
      saveexit: canSaveCurrent ? 'Сохранить рекорд и выйти' : 'Сохранить и выйти (не рекорд)',
      exit: 'Выйти без сохранения'
    };

    this.pauseItems.forEach((id, i) => {
      const row = uiRowRect(i, PAUSE_TOP, PAUSE_STEP);
      const selected = i === this.pauseIndex;
      const enabled = !(id === 'saveexit' && !canSaveCurrent);

      this.drawUIButton(ctx, row, labels[id], selected, enabled, selected ? 38 : 34);
    });

    this.drawText(
      ctx,
      `Формула рекорда: Rating = Score × (0.75×Vmax + 0.25×Vmin) / ${DEFAULT_SPEED}`,
      W / 2,
      760,
      18,
      '#445566'
    );
  }

  renderGameOver(ctx) {
    this.renderPlay(ctx);

    ctx.fillStyle = 'rgba(0, 0, 0, 0.68)';
    ctx.fillRect(0, 0, W, H);

    this.drawText(ctx, 'GAME OVER', W / 2, 140, 80, '#ff5566');
    this.drawText(ctx, `Score: ${this.finalScore}`, W / 2, 225, 42, '#ffffff');

    if (this.pendingRecord) {
      this.drawText(
        ctx,
        `Record rating: ${this.pendingRecord.rating}`,
        W / 2,
        278,
        34,
        '#ffd76a'
      );
    } else {
      this.drawText(
        ctx,
        'Record rating: 0',
        W / 2,
        278,
        34,
        '#5d7184'
      );
    }

    const canSave = Boolean(this.pendingRecord && this.pendingQualifies);

    const labels = {
      restart: 'Заново',
      save: canSave ? 'Сохранить рекорд' : 'Не рекорд',
      menu: 'В меню'
    };

    this.gameoverItems.forEach((id, i) => {
      const row = uiRowRect(i, GAMEOVER_TOP, GAMEOVER_STEP);
      const selected = i === this.gameoverIndex;
      const enabled = !(id === 'save' && !canSave);

      this.drawUIButton(ctx, row, labels[id], selected, enabled, selected ? 40 : 36);
    });

    this.drawText(
      ctx,
      `Формула рекорда: Rating = Score × (0.75×Vmax + 0.25×Vmin) / ${DEFAULT_SPEED}`,
      W / 2,
      760,
      18,
      '#445566'
    );
  }

  renderRecords(ctx) {
  ctx.fillStyle = '#04060a';
  ctx.fillRect(0, 0, W, H);

  this.drawText(ctx, 'РЕКОРДЫ', W / 2, 70, 76, '#66ddff');

  this.drawText(
    ctx,
    `Rating = Score × (0.75×Vmax + 0.25×Vmin) / ${DEFAULT_SPEED}`,
    W / 2,
    130,
    24,
    '#ffd76a'
  );

  if (!this.records.length) {
    this.drawText(
      ctx,
      'Пока нет сохранённых рекордов',
      W / 2,
      300,
      40,
      '#8fa3b8'
    );
  } else {
    // Сколько рекордов показывать крупно.
    const shown = this.records.slice(0, 6);

    shown.forEach((r, i) => {
      const y = 200 + i * 78;

      const name = String(r.name || 'PLAYER').slice(0, 10);

      // Крупная строка: место + имя слева, рейтинг справа.
      this.drawText(
        ctx,
        `${i + 1}. ${name}`,
        80,
        y,
        34,
        i === 0 ? '#ffd76a' : '#ffffff',
        'left'
      );

      this.drawText(
        ctx,
        `${r.rating}`,
        W - 80,
        y,
        34,
        i === 0 ? '#ffd76a' : '#66ddff',
        'right'
      );

      // Строка деталей помельче.
      const dateText = r.date
        ? new Date(r.date).toLocaleString('ru-RU', {
            day: '2-digit',
            month: '2-digit',
            year: '2-digit',
            hour: '2-digit',
            minute: '2-digit'
          })
        : '';

      this.drawText(
        ctx,
        `score ${r.score}   speed ${speedLabelFromRecord(r)}   ${dateText}`,
        80,
        y + 36,
        22,
        '#7f93a8',
        'left'
      );
    });
  }

  this.drawUIButton(ctx, recordsBackRect(), 'НАЗАД', false, true, 48);
}

  renderNameOverlayBackground(ctx) {
    ctx.fillStyle = '#04060a';
    ctx.fillRect(0, 0, W, H);

    this.drawText(ctx, 'Ввод имени рекорда', W / 2, H / 2, 42, '#66ddff');
  }

  loop(ts) {
    const dt = Math.min(50, ts - this.last);
    this.last = ts;

    this.time += dt;

    this.fsm.update(dt);
    this.fsm.render(this.ctx);

    requestAnimationFrame(this.loop);
  }
}

new Game(document.getElementById('game'));
</script>
</body>
